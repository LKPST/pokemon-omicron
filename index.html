    <!-- 5. Main Game Scenes, Config & Boot -->
      <!-- Local scripts are fetched with cache:'no-cache' (the server answers 304 when nothing changed), so an upload shows up on the NEXT reload - no ?v= needed.
         If fetch is not possible (file://, offline), the normal <script src> loading is used. -->
    <script>
    (function () {
      var files = [
      "tables/TrainerTables.js",
      "tables/PokemonDatabase.js",
      "tables/PokeballTables.js",
      "js/GameStateManagerClass.js",
      "js/ThrowPokeBallAnim.js",
      "js/utils/EmeraldFont.js",
      "js/ow_table.js",
      "js/Overworld_map.js",
      "js/movement_type.js",
      "js/overworld_script_engine.js",
      "js/OverworldScene.js",
      "js/BaseScene.js",
      "js/givepokemon.js",
      "tables/tiles.js",
      "js/overworld_script_commands.js",
      "js/overworld_scripts.js",
      "js/overworld_textbox.js",
      "js/OverworldUI.js",
      "js/AssetWarmup.js",
      "tables/TypeTables.js",
      "tables/MoveTables.js",
      "tables/LearnsetTables.js",
      "tables/EvolutionTables.js",
      "js/BattleEngine.js",
      "js/TrainerTables.js",
      "js/ItemSystem.js",
      "js/ItemTables.js",
      "tables/PokedexTables.js",
      "js/SaveSystem.js",
      "js/StartMenu.js",
      "tables/OverworldSprites.js",
      "js/OverworldSpriteLoader.js",
      "js/OverworldFollower.js",
      "js/OverworldWild.js",
      "js/BattleTransition.js",
      "js/PokemonSummary.js",
      "js/BagMenu.js",
      "js/BattleScene.js",
      "js/Layout.js",
      "js/TouchControls.js",
      "js/config.js",
      "tables/global.js"
      ];
      files = files.filter(function (f, i) { return files.indexOf(f) === i; });   // a file listed twice would be declared twice
      window.__PM_LOADING = true;
      function plain(i) {   // fallback: ordinary script tags, one after another
        if (i >= files.length) { window.__PM_LOADING = false; if (window.boot) window.boot(); return; }
        var s = document.createElement('script'); s.src = files[i] + '?t=' + Date.now(); s.async = false;
        s.onload = s.onerror = function () { plain(i + 1); }; document.head.appendChild(s);
      }
      if (!window.fetch || location.protocol === 'file:') { plain(0); return; }
      Promise.all(files.map(function (f) { return fetch(f, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(f + ' -> HTTP ' + r.status); return r.text(); }); }))
        .then(function (texts) {
          texts.forEach(function (t, i) { try { var s = document.createElement('script'); s.text = t + '\n//# sourceURL=' + files[i]; document.head.appendChild(s); } catch (e) { console.error('[loader] ' + files[i] + ' failed to run:', e); } });
          window.__PM_LOADING = false; if (window.boot) window.boot();
        })
        .catch(function (e) { console.warn('[loader] fetch failed, using plain script tags:', e); plain(0); });
    })();
    </script>
