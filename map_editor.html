<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Pokémon Micron – Map Editor</title>
<!-- Everything is read from your tables. The loader below looks for each file in several common folders
     (js/, tables/, same folder, ../js/, ../tables/, ../ ...) and remembers where it found them. The script engine and movement files are optional. -->
<script>
window.__ready=(async()=>{
  const DIRS=['js/','tables/','','../js/','../tables/','../','data/','../data/','../../js/','../../'];
  const FILES=[['ow_table.js','OW_table.js','overworld_table.js','OverworldTable.js'],['Overworld_map.js','overworld_map.js'],['tiles.js','Tiles.js'],
    ['PokemonDatabase.js','pokemondatabase.js'],['overworld_script_engine.js'],['overworld_movement.js']];
  let mem={};try{mem=JSON.parse(localStorage.edPaths||'{}')}catch(e){}
  const tryLoad=src=>new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=()=>r(true);s.onerror=()=>{s.remove();r(false)};document.head.appendChild(s)});
  window.__missing=[];
  for(const names of FILES){let ok=false;const cand=[];if(mem[names[0]])cand.push(mem[names[0]]);for(const d of DIRS)for(const n of names)cand.push(d+n);
    for(const c of [...new Set(cand)]){if(await tryLoad(c)){mem[names[0]]=c;ok=true;break}}
    if(!ok){window.__missing.push(names[0]);delete mem[names[0]]}}
  try{localStorage.edPaths=JSON.stringify(mem)}catch(e){}
})();
</script>
<style>

<script>
window.__ready.then(()=>{
const TS=32,$=id=>document.getElementById(id),clone=o=>JSON.parse(JSON.stringify(o)),uniq=a=>[...new Set(a)];
const OT=()=>window.OverworldTable||{},TL=()=>window.OverworldTiles||{};
let repo={},active='',tool='pencil',brush={tid:0,cells:[['0|0']],frames:new Set([0])},sel=null,cam={x:60,y:60,z:1};
let hist=[],redoS=[],pending=false,unsaved=false,fileHandle=null,hover=null,stroke=null,rectA=null,drag=null,pan=null,pal=null,spaceDown=false,showGrid=true,showSpr=true;
const cv=$('cv'),ctx=cv.getContext('2d');
const EMPTY=l=>l>1?'':'0|0';
// cell = "tileID|frameID|behavior"  0 passable · 1 blocked · 2 passable, NPC below · 3 surfable · 4 diveable
const passOf=v=>parseInt((v||'').split('|')[2])||0;
const setPass=(v,p)=>{const[a,b]=v.split('|');return `${a}|${b||0}|${p}`};
let pass=0,clip=null;
const cellStr=(v,l=1)=>typeof v==='number'?`${v}|0`:(typeof v==='string'&&v.includes('|'))?v:(typeof v==='string'&&v.trim()!==''&&!isNaN(parseInt(v)))?`${parseInt(v)}|0`:EMPTY(l);
let layer=1,viewMode='all',tab='env';
const norm=s=>String(s==null?'':s).replace(/[\s_]/g,'').toLowerCase();
const findKey=n=>{if(n==null)return null;if(repo[n])return n;return Object.keys(repo).find(k=>norm(k)===norm(n)||norm(repo[k].map)===norm(n))||null};
const OPP={up:'down',down:'up',left:'right',right:'left'};

// 5 tile layers: tileData_1 (bottom) … tileData_5 (top). Old single `tileData` becomes layer 1.
function fit(m){const{width:w,height:h}=m.dimensions;for(let l=1;l<=5;l++){const src=m['tileData_'+l]||(l===1?m.tileData:null);
  m['tileData_'+l]=Array.from({length:h},(_,r)=>Array.from({length:w},(_,c)=>cellStr(src?.[r]?.[c],l)))}delete m.tileData}
// ---------- border block (borderData) ----------
// Repeats around the maps. Default 2x2, up to 5 layers, always impassable. Cells are "tile|frame|1"; "" = empty.
const bcell=v=>typeof v==='string'&&/^\d+\|/.test(v)?v:'';
function fitBorder(m,w,h){const b=m.borderData||={};w=Math.max(1,Math.min(16,w||b.width||2));h=Math.max(1,Math.min(16,h||b.height||2));b.width=w;b.height=h;
  for(let l=1;l<=5;l++){const s=b['tileData_'+l];b['tileData_'+l]=Array.from({length:h},(_,r)=>Array.from({length:w},(_,c)=>bcell(s?.[r]?.[c])))}}
function load(){repo=clone(window.OverworldMaps||{});for(const m of Object.values(repo)){m.dimensions||={width:10,height:10,blockSize:8};m.events||={};m.connections||={up:null,down:null,left:null,right:null};m.wildData||={morning:[],afternoon:[],night:[],dawn:[]};fit(m);fitBorder(m)}active=Object.keys(repo)[0]||''}

// ---------- world layout (same rules as the game) ----------
function layout(){const o={},keys=Object.keys(repo);
  const place=(s,sx,sy)=>{o[s]={x:sx,y:sy};const q=[s];while(q.length){const k=q.shift(),m=repo[k],p=o[k];
    for(const[d,c]of Object.entries(m.connections||{})){const n=c&&findKey(c[0]);if(!n||o[n])continue;const nm=repo[n],off=c[2]||0;let x,y;
      if(d==='up'){x=p.x+off;y=p.y-nm.dimensions.height}else if(d==='down'){x=p.x+off;y=p.y+m.dimensions.height}
      else if(d==='left'){x=p.x-nm.dimensions.width;y=p.y+off}else if(d==='right'){x=p.x+m.dimensions.width;y=p.y+off}else continue;
      o[n]={x,y};q.push(n)}}};
  if(keys.length)place(keys[0],0,0);
  for(const k of keys){if(o[k])continue;let r=0;for(const[kk,p]of Object.entries(o))r=Math.max(r,p.x+repo[kk].dimensions.width);place(k,r+4,0)}
  return o}

// ---------- images / sprites ----------
const imgs={};let pt;
let assetBase='';try{assetBase=localStorage.edAssets||''}catch(e){}
const PREF=['','../','../../','../../../','/'];
function img(p){if(!p)return null;let i=imgs[p];if(!i){i=imgs[p]=new Image();i.n=-1;
  const go=()=>{i.n++;const b=i.n===0?assetBase:PREF[i.n-1];i.pre=b;i.src=(/^(https?:|data:|\/)/.test(p)?'':b)+p};
  i.onload=()=>{i.ok=1;if(i.pre!==assetBase){assetBase=i.pre;try{localStorage.edAssets=assetBase}catch(e){}$('assetBase').value=assetBase}redraw();clearTimeout(pt);pt=setTimeout(buildPalette,60)};
  i.onerror=()=>{if(i.n<PREF.length)go()};go()}return i.ok?i:null}
const sprs={};
function spr(id){const e=OT()[id];if(!e)return null;if(sprs[id])return sprs[id];const i=img(e.owSprite);if(!i)return null;
  const[w,h]=(e.trueDimension||'32x32').split('x').map(Number),c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(i,0,0,w,h,0,0,w,h);
  try{const d=x.getImageData(0,0,w,h),p=d.data;if(p[3]){const k=[p[0],p[1],p[2]],st=[],seen=new Uint8Array(w*h);
    const bg=j=>p[j*4+3]&&Math.abs(p[j*4]-k[0])<7&&Math.abs(p[j*4+1]-k[1])<7&&Math.abs(p[j*4+2]-k[2])<7;
    const sd=(a,b)=>{const j=b*w+a;if(!seen[j]&&bg(j)){seen[j]=1;st.push(j)}};
    for(let a=0;a<w;a++){sd(a,0);sd(a,h-1)}for(let b=0;b<h;b++){sd(0,b);sd(w-1,b)}
    while(st.length){const j=st.pop();p[j*4+3]=0;const a=j%w,b=(j/w)|0;if(a>0)sd(a-1,b);if(a<w-1)sd(a+1,b);if(b>0)sd(a,b-1);if(b<h-1)sd(a,b+1)}
    x.putImageData(d,0,0)}}catch(e){}
  return sprs[id]=c}

function tileImg(d){return img(d.tileImage)}
function drawTile(c,val,x,y,s){if(!val)return;c.imageSmoothingEnabled=false;const[t,f]=val.split('|').map(n=>parseInt(n)||0),d=TL()[t];
  if(!d||!d.tileImage){c.fillStyle='#78c850';c.fillRect(x,y,s,s);return}
  const i=tileImg(d);if(!i){c.fillStyle='#456';c.fillRect(x,y,s,s);return}
  if(/^Multi-tile/.test(d.tileType)){const n=d.columns||3;c.drawImage(i,(f%n)*16,Math.floor(f/n)*16,16,16,x,y,s,s)}
  else if(d.isAnimated){const[w,h]=String(d.tileDimension||'16x16').split('x').map(Number);c.drawImage(i,0,0,w||16,h||16,x,y,s,s)}else c.drawImage(i,x,y,s,s)}

const BR=14;
function ownerOf(IN,x,y){let best=null,bd=1e9;for(const i of IN){const d=Math.max(i.x-x,x-(i.x+i.w-1),i.y-y,y-(i.y+i.h-1));if(d<=0)return null;if(d<bd){bd=d;best=i}}return bd<=BR?best:null}
function drawBorders(L,W,H){const IN=Object.entries(repo).map(([k,m])=>({m,x:L[k].x,y:L[k].y,w:m.dimensions.width,h:m.dimensions.height}));
  const x0=Math.floor(-cam.x/cam.z/TS)-1,x1=Math.ceil((W-cam.x)/cam.z/TS)+1,y0=Math.floor(-cam.y/cam.z/TS)-1,y1=Math.ceil((H-cam.y)/cam.z/TS)+1;
  if((x1-x0)*(y1-y0)>40000)return;ctx.globalAlpha=.85;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const o=ownerOf(IN,x,y);if(!o)continue;const b=o.m.borderData;if(!b)continue;
    const bx=((x-o.x)%b.width+b.width)%b.width,by=((y-o.y)%b.height+b.height)%b.height;let any=false;
    for(let l=1;l<=5;l++){const v=b['tileData_'+l][by][bx];if(v){any=true;drawTile(ctx,v,x*TS,y*TS,TS)}}
    if(any){ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(x*TS,y*TS,TS,TS)}}
  ctx.globalAlpha=1}

// ---------- event geometry ----------
const BADGE={Warp:['#8e24aa','W'],Script:['#43a047','S'],'Script Tile':['#43a047','S'],Signpost:['#fb8c00','!'],Tile:['#1e88e5','T'],NPC:['#e53935','N']};
function isBuilding(ev){return OT()[ev.owID]?.owType==='Building'}
function evRect(p,ev){const ox=p.x*TS,oy=p.y*TS,e=OT()[ev.owID];
  if(showSpr&&e&&ev.eventType==='NPC'){const[w,h]=(e.trueDimension||'32x32').split('x').map(Number),cx=ox+ev.xPos*TS+16;
    return isBuilding(ev)?{x:cx-w/2,y:oy+(ev.yPos+1)*TS-h,w,h}:{x:cx-w/2,y:oy+ev.yPos*TS+16-h*.85,w,h}}
  return{x:ox+ev.xPos*TS,y:oy+ev.yPos*TS,w:TS,h:TS}}
function footprint(ev){const e=OT()[ev.owID];if(!e||!isBuilding(ev))return null;const[w,h]=(e.trueDimension||'32x32').split('x').map(Number),fw=Math.ceil(w/32),fh=Math.ceil(h/32);
  return{x0:ev.xPos-Math.floor((fw-1)/2),x1:ev.xPos+Math.floor(fw/2),y0:ev.yPos-(fh-1),y1:ev.yPos}}

// ---------- drawing ----------
let queued=false;function redraw(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;draw()})}
function draw(){const W=cv.clientWidth,H=cv.clientHeight;if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b0b0b';ctx.fillRect(0,0,W,H);ctx.setTransform(cam.z,0,0,cam.z,cam.x,cam.y);ctx.imageSmoothingEnabled=false;
  const L=layout();
  if($('borT').checked)drawBorders(L,W,H);
  for(const[k,m]of Object.entries(repo)){const p=L[k],{width:w,height:h}=m.dimensions;
    for(let l=1;l<=5;l++){if(viewMode==='active'&&l!==layer)continue;if(viewMode==='below'&&l>layer)continue;const g=m['tileData_'+l];for(let r=0;r<h;r++)for(let c=0;c<w;c++)drawTile(ctx,g[r][c],(p.x+c)*TS,(p.y+r)*TS,TS)}
    if($('bhvT').checked){const g=m['tileData_'+layer],C=['','rgba(255,0,0,.35)','rgba(80,120,255,.35)','rgba(0,220,220,.35)','rgba(170,0,255,.35)'];
      for(let r=0;r<h;r++)for(let c=0;c<w;c++){const q=passOf(g[r][c]);if(q){ctx.fillStyle=C[q];ctx.fillRect((p.x+c)*TS,(p.y+r)*TS,TS,TS);ctx.fillStyle='#fff';ctx.font='bold 12px monospace';ctx.fillText(q,(p.x+c)*TS+4,(p.y+r)*TS+14)}}}
    if(showGrid&&cam.z>.4){ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=1/cam.z;ctx.beginPath();
      for(let c=0;c<=w;c++){ctx.moveTo((p.x+c)*TS,p.y*TS);ctx.lineTo((p.x+c)*TS,(p.y+h)*TS)}
      for(let r=0;r<=h;r++){ctx.moveTo(p.x*TS,(p.y+r)*TS);ctx.lineTo((p.x+w)*TS,(p.y+r)*TS)}ctx.stroke()}
    if(k!==active){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(p.x*TS,p.y*TS,w*TS,h*TS)}
    ctx.strokeStyle=k===active?'#00e5ff':'#76ff03';ctx.lineWidth=2/cam.z;ctx.strokeRect(p.x*TS,p.y*TS,w*TS,h*TS);
    ctx.fillStyle='#fff';ctx.font=`${12/cam.z}px monospace`;ctx.fillText(k,p.x*TS,p.y*TS-4/cam.z)}
  for(const[k,m]of Object.entries(repo)){const p=L[k];
    for(const[ek,ev]of Object.entries(m.events)){
      const fp=footprint(ev);if(fp){ctx.fillStyle='rgba(255,0,0,.14)';ctx.fillRect((p.x+fp.x0)*TS,(p.y+fp.y0)*TS,(fp.x1-fp.x0+1)*TS,(fp.y1-fp.y0+1)*TS)}
      const R=evRect(p,ev),s=ev.eventType==='NPC'&&showSpr?spr(ev.owID):null;
      if(s)ctx.drawImage(s,R.x,R.y,R.w,R.h);
      else{const[col,ch]=BADGE[ev.eventType]||['#777','?'];ctx.fillStyle=col;ctx.globalAlpha=.85;ctx.fillRect(R.x+3,R.y+3,TS-6,TS-6);ctx.globalAlpha=1;
        ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.fillText(ch,R.x+TS/2,R.y+TS/2+6);ctx.textAlign='left'}
      if(sel&&sel.map===k&&sel.key===ek){ctx.strokeStyle='#ffd600';ctx.lineWidth=2/cam.z;ctx.strokeRect(R.x,R.y,R.w,R.h)}}}
  if(hover&&repo[hover.map]){const p=L[hover.map],n=tool==='pencil'?brush.cells:tool==='paste'&&clip?Array.from({length:clip.h},()=>Array(clip.w).fill(0)):[[0]];ctx.strokeStyle='#ffd600';ctx.lineWidth=2/cam.z;
    ctx.strokeRect((p.x+hover.gx)*TS,(p.y+hover.gy)*TS,n[0].length*TS,n.length*TS)}
  if(rectA&&hover&&rectA.map===hover.map){const p=L[rectA.map],a=Math.min(rectA.gx,hover.gx),b=Math.min(rectA.gy,hover.gy),
    c=Math.abs(rectA.gx-hover.gx)+1,d=Math.abs(rectA.gy-hover.gy)+1;ctx.fillStyle='rgba(0,229,255,.25)';ctx.fillRect((p.x+a)*TS,(p.y+b)*TS,c*TS,d*TS)}
  if(drag&&hover){const p=L[hover.map];ctx.setLineDash([4/cam.z,3/cam.z]);ctx.strokeStyle='#fff';ctx.strokeRect((p.x+hover.gx-drag.ox)*TS,(p.y+hover.gy-drag.oy)*TS,TS,TS);ctx.setLineDash([])}
}

// ---------- history ----------
const snap=()=>JSON.stringify(repo);
function touch(){if(pending)return;hist.push(snap());if(hist.length>100)hist.shift();redoS=[];pending=true;unsaved=true}
function commit(fn){touch();fn();pending=false;changed()}
function restore(s){repo=JSON.parse(s);if(!repo[active])active=Object.keys(repo)[0]||'';if(sel&&!repo[sel.map]?.events[sel.key])sel=null;refreshAll()}
function undo(){if(!hist.length)return;redoS.push(snap());restore(hist.pop())}
function redo(){if(!redoS.length)return;hist.push(snap());restore(redoS.pop())}

// ---------- coordinates / hit tests ----------
const toWorld=(mx,my)=>({x:(mx-cam.x)/cam.z,y:(my-cam.y)/cam.z});
function cellAt(wx,wy){const L=layout();for(const[k,p]of Object.entries(L)){const m=repo[k],gx=Math.floor(wx/TS)-p.x,gy=Math.floor(wy/TS)-p.y;
  if(gx>=0&&gy>=0&&gx<m.dimensions.width&&gy<m.dimensions.height)return{map:k,gx,gy}}return null}
function eventAt(wx,wy){const L=layout();let hit=null;for(const[k,m]of Object.entries(repo))for(const[ek,ev]of Object.entries(m.events)){
  const R=evRect(L[k],ev);if(wx>=R.x&&wx<R.x+R.w&&wy>=R.y&&wy<R.y+R.h)hit={map:k,key:ek}}return hit}

// ---------- painting ----------
function setCell(k,r,c,v,l=layer){const g=repo[k]['tileData_'+l];if(!g[r]||g[r][c]===undefined||g[r][c]===v)return;touch();g[r][c]=v}
// Copy a rectangle (all layers, or only the active one) and paste it with the Paste tool
function doCopy(a,b){const m=repo[a.map],x0=Math.min(a.gx,b.gx),x1=Math.max(a.gx,b.gx),y0=Math.min(a.gy,b.gy),y1=Math.max(a.gy,b.gy),all=$('copyAll').checked,L={};
  for(let l=1;l<=5;l++){if(!all&&l!==layer)continue;L[l]=[];for(let y=y0;y<=y1;y++)L[l].push(m['tileData_'+l][y].slice(x0,x1+1))}
  clip={w:x1-x0+1,h:y1-y0+1,L,single:!all};setTool('paste');$('brushInfo').textContent=`Clipboard: ${clip.w}×${clip.h}, ${Object.keys(L).length} layer(s) – click/drag to paste`}
function stampClip(k,gx,gy){if(!clip)return;for(const[l,g]of Object.entries(clip.L)){const tl=clip.single?layer:+l;g.forEach((row,r)=>row.forEach((v,c)=>setCell(k,gy+r,gx+c,v,tl)))}}
function stamp(k,gx,gy,pat){pat.forEach((row,r)=>row.forEach((v,c)=>setCell(k,gy+r,gx+c,v)))}
function line(a,b,fn){let x=a.gx,y=a.gy;const dx=Math.abs(b.gx-x),dy=Math.abs(b.gy-y),sx=x<b.gx?1:-1,sy=y<b.gy?1:-1;let e=dx-dy;
  for(;;){fn(x,y);if(x===b.gx&&y===b.gy)break;const e2=2*e;if(e2>-dy){e-=dy;x+=sx}if(e2<dx){e+=dx;y+=sy}}}
function floodFill(k,gx,gy,pat){const g=repo[k]['tileData_'+layer],t=g[gy][gx],h=g.length,w=g[0].length,seen=new Set([gy*w+gx]),q=[[gx,gy]],cells=[];
  while(q.length){const[x,y]=q.pop();cells.push([x,y]);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;
    if(nx<0||ny<0||nx>=w||ny>=h||seen.has(ny*w+nx)||g[ny][nx]!==t)continue;seen.add(ny*w+nx);q.push([nx,ny])}}
  const ph=pat.length,pw=pat[0].length;for(const[x,y]of cells)setCell(k,y,x,pat[((y-gy)%ph+ph)%ph][((x-gx)%pw+pw)%pw])}
function fillRect(a,b,pat){const x0=Math.min(a.gx,b.gx),x1=Math.max(a.gx,b.gx),y0=Math.min(a.gy,b.gy),y1=Math.max(a.gy,b.gy),ph=pat.length,pw=pat[0].length;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)setCell(a.map,y,x,pat[(y-y0)%ph][(x-x0)%pw])}

// ---------- events: add / duplicate / delete ----------
const SCHEMA={
  NPC:[['owID','select','ow'],['script','select','script'],['movementType','select','move'],['isTrainer','bool'],['viewRadius','num'],['flagID','text']],
  Script:[['script','select','script']],'Script Tile':[['script','select','script'],['scriptVar','text'],['varValue','num']],
  Signpost:[['script','select','script']],Tile:[['tileID','num']],
  Warp:[['map','select','map'],['targetWarp','select','warp'],['targetX','num?'],['targetY','num?'],['facing','select','facing'],['warpType','select','warpType']]};
const allEv=()=>Object.values(repo).flatMap(m=>Object.values(m.events));
const OPTS={ow:()=>Object.keys(OT()),map:()=>Object.keys(repo),
  script:()=>uniq([...Object.keys(window.OverworldScriptEngine?.scripts||{}),...allEv().map(e=>e.script).filter(Boolean)]),
  move:()=>uniq([...Object.keys(window.OverworldMovement?.types||{}),'MOVEMENT_TYPE_LOOK_AROUND','MOVEMENT_TYPE_WANDER_LEFT_RIGHT','MOVEMENT_TYPE_WANDER_UP_AND_DOWN',...allEv().map(e=>e.movementType).filter(Boolean)]),
  facing:()=>['Down','Up','Left','Right'],warpType:()=>['Normal','Teleport','Hole'],
  warp:ev=>Object.entries(repo[findKey(ev.map)]?.events||{}).filter(([,v])=>v.eventType==='Warp').map(([k])=>k)};
function newEv(t){const m=repo[active],e={eventType:t,xPos:hover?.map===active?hover.gx:0,yPos:hover?.map===active?hover.gy:0};
  if(t==='NPC'){e.owID=Object.keys(OT()).find(k=>OT()[k].owType!=='Building')||'';e.script='';e.movementType='MOVEMENT_TYPE_LOOK_AROUND';e.isTrainer=false;e.viewRadius=3;e.flagID=''}
  if(t==='Script'||t==='Signpost')e.script='';if(t==='Tile')e.tileID=0;
  if(t==='Warp'){e.map=Object.keys(repo).find(k=>k!==active)||active;e.facing='Down';e.warpType='Normal'}return e}
function addEvent(t){commit(()=>{const ev=newEv(t),m=repo[active];let k=`${t.replace(/\s/g,'_')}_1`,i=1;while(m.events[k])k=`${t.replace(/\s/g,'_')}_${++i}`;m.events[k]=ev;sel={map:active,key:k}})}
function duplicate(){if(!sel)return;commit(()=>{const m=repo[sel.map],ev=clone(m.events[sel.key]);ev.xPos=Math.min(m.dimensions.width-1,ev.xPos+1);
  let k=`${sel.key}_copy`,i=1;while(m.events[k])k=`${sel.key}_copy${++i}`;m.events[k]=ev;sel={map:sel.map,key:k}})}
function delEvent(){if(!sel)return;commit(()=>{delete repo[sel.map].events[sel.key];sel=null})}

// ---------- UI builders ----------
function inp(type,val,set,optsFn){let e;

  else if(type==='bool'){e=document.createElement('input');e.type='checkbox';e.checked=!!val}
  else{e=document.createElement('input');e.type=type.startsWith('num')?'number':'text';e.value=val??''}
  e.onchange=()=>commit(()=>set(type==='bool'?e.checked:(type==='text'||optsFn)?e.value:(e.value===''?undefined:Number(e.value))));return e}
function rowTo(box,label,el){const l=document.createElement('label');l.textContent=label;l.appendChild(el);box.appendChild(l)}
function buildInspector(){const I=$('inspector');I.innerHTML='';const ev=sel&&repo[sel.map]?.events[sel.key];
  if(!ev){I.innerHTML='<i>Pick the Select tool (V) and click an event.</i>';return}
  const m=repo[sel.map];
  rowTo(I,`Key (${ev.eventType} on ${sel.map})`,inp('text',sel.key,v=>{if(v&&!m.events[v]){m.events[v]=ev;delete m.events[sel.key];sel.key=v}}));
  const xy=document.createElement('div');xy.className='row';I.appendChild(xy);
  rowTo(xy,'X',inp('num',ev.xPos,v=>ev.xPos=v??0));rowTo(xy,'Y',inp('num',ev.yPos,v=>ev.yPos=v??0));
  for(const[f,t,o]of SCHEMA[ev.eventType]||[]){
    rowTo(I,f,inp(t==='select'?'text':t,ev[f],v=>{v===undefined||v===''?delete ev[f]:ev[f]=v},o?()=>OPTS[o](ev):null))}}
function renameMap(o,n){if(!n||repo[n])return;const r={};for(const[k,m]of Object.entries(repo))r[k===o?n:k]=m;repo=r;repo[n].map=n;
  for(const m of Object.values(repo)){for(const c of Object.values(m.connections))if(c&&findKey(c[0])===null&&norm(c[0])===norm(o))c[0]=n;
    for(const e of Object.values(m.events))if(e.map&&norm(e.map)===norm(o))e.map=n}active=n;if(sel?.map===o)sel.map=n}
function setConn(dir,name,off){const m=repo[active],old=m.connections[dir],oldT=old&&repo[findKey(old[0])];
  if(oldT&&oldT.connections[OPP[dir]]&&findKey(oldT.connections[OPP[dir]][0])===active)oldT.connections[OPP[dir]]=null;
  if(!name){m.connections[dir]=null;return}const t=repo[findKey(name)];m.connections[dir]=[name,t?.bank??0,off||0];
  if(t){t.connections||={};t.connections[OPP[dir]]=[active,m.bank??0,-(off||0)]}}
function buildProps(){const P=$('props');P.innerHTML='';const m=repo[active];if(!m)return;
  rowTo(P,'Name',inp('text',active,v=>renameMap(active,v.trim())));

  rowTo(P,'Flyable',inp('bool',m.isFlyable,v=>m.isFlyable=v));rowTo(P,'Running',inp('bool',m.isRunning,v=>m.isRunning=v));
  const h=document.createElement('div');h.textContent='Connections (reciprocal link is kept in sync)';h.style.color='#00acc1';const CN=$('conns');CN.innerHTML='';CN.appendChild(h);

function issues(){const out=[];
  for(const[k,m]of Object.entries(repo)){
    for(const[dir,c]of Object.entries(m.connections||{}))if(c&&!findKey(c[0]))out.push(`${k}: connection ${dir} → "${c[0]}" does not exist`);
    for(const[ek,e]of Object.entries(m.events)){const at=`${k}/${ek}`;
      if(e.xPos<0||e.yPos<0||e.xPos>=m.dimensions.width||e.yPos>=m.dimensions.height)out.push(`${at}: outside the map`);
      if(e.eventType==='NPC'){if(!OT()[e.owID])out.push(`${at}: owID "${e.owID}" not in OverworldTable`);
        const ge=window.OverworldScriptEngine?.scripts;if(ge&&e.script&&!ge[e.script])out.push(`${at}: script "${e.script}" not found`)}
      if(e.eventType==='Warp'){const t=findKey(e.map);if(!t)out.push(`${at}: target map "${e.map}" does not exist`);
        else if(e.targetWarp&&!repo[t].events[e.targetWarp])out.push(`${at}: targetWarp "${e.targetWarp}" not in ${t}`)}}
    const seen={};for(const[ek,e]of Object.entries(m.events))if(e.eventType==='NPC'){const id=`${e.xPos},${e.yPos}`;if(seen[id])out.push(`${k}: ${ek} and ${seen[id]} share tile ${id}`);seen[id]=ek}}
  return out}
function buildIssues(){const l=issues();$('issueCount').textContent=l.length?`(${l.length})`:'✓';$('issues').innerHTML=l.length?l.map(x=>`<div class=bad>• ${x}</div>`).join(''):'<div class=ok>No problems found</div>'}

function buildPalette(){const P=$('palette');P.innerHTML='';

function ser(v,ind=''){if(v===null||typeof v!=='object')return JSON.stringify(v);const n=ind+'  ';
  if(Array.isArray(v)){if(v.every(x=>x===null||typeof x!=='object'))return'['+v.map(x=>JSON.stringify(x)).join(', ')+']';return'[\n'+v.map(x=>n+ser(x,n)).join(',\n')+'\n'+ind+']'}
  const ks=Object.keys(v);if(!ks.length)return'{}';return'{\n'+ks.map(k=>n+JSON.stringify(k)+': '+ser(v[k],n)).join(',\n')+'\n'+ind+'}'}
const out=()=>'window.OverworldMaps = '+ser(repo)+';\n';
async function save(){const t=out();
  if(window.showSaveFilePicker){try{fileHandle||=await showSaveFilePicker({suggestedName:'Overworld_map.js',types:[{description:'JavaScript',accept:{'text/javascript':['.js']}}]});
    const w=await fileHandle.createWritable();await w.write(t);await w.close();unsaved=false;status();return}catch(e){if(e.name==='AbortError')return;fileHandle=null}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));a.download='Overworld_map.js';a.click();unsaved=false;status()}

let btool='pencil',bstroke=null;
const bclamp=v=>Math.max(1,Math.min(16,v||1));
function bset(b,l,r,c,v){const g=b['tileData_'+l];if(!g[r]||g[r][c]===undefined||g[r][c]===v)return;touch();g[r][c]=v}

function bfill(b,x,y,pat){const g=b['tileData_'+layer],t=g[y][x],seen=new Set([y*b.width+x]),q=[[x,y]],cells=[];
  while(q.length){const[cx,cy]=q.pop();cells.push([cx,cy]);for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;
    if(nx<0||ny<0||nx>=b.width||ny>=b.height||seen.has(ny*b.width+nx)||g[ny][nx]!==t)continue;seen.add(ny*b.width+nx);q.push([nx,ny])}}
  const ph=pat.length,pw=pat[0].length;for(const[cx,cy]of cells){const v=pat[((cy-y)%ph+ph)%ph][((cx-x)%pw+pw)%pw];bset(b,layer,cy,cx,v?setPass(v,1):v)}}
function drawBorderEd(){const c=$('bcv');if(!c)return;const m=repo[active],b=m&&m.borderData;if(!b)return;const cs=c.width/b.width,g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.imageSmoothingEnabled=false;
  for(let l=1;l<=5;l++)for(let r=0;r<b.height;r++)for(let q=0;q<b.width;q++){const v=b['tileData_'+l][r][q];if(v){g.globalAlpha=l===layer?1:.55;drawTile(g,v,q*cs,r*cs,cs)}}
  g.globalAlpha=1;g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;g.beginPath();for(let q=0;q<=b.width;q++){g.moveTo(q*cs+.5,0);g.lineTo(q*cs+.5,c.height)}for(let r=0;r<=b.height;r++){g.moveTo(0,r*cs+.5);g.lineTo(c.width,r*cs+.5)}g.stroke()}
function buildBorder(){const U=$('borderUI');if(!U)return;U.innerHTML='';const m=repo[active];if(!m)return;const b=m.borderData;if(!b)return;
  const n=document.createElement('div');n.style.cssText='color:#9ab;line-height:1.4';n.innerHTML='Border block for <b>'+active+'</b>. It repeats over the black space around the maps and is always impassable. Pick tiles in the palette below, then paint the pattern here. Faded tiles belong to other layers.';U.appendChild(n);
  const wh=document.createElement('div');wh.className='row';U.appendChild(wh);
  rowTo(wh,'Width (1-16)',inp('num',b.width,v=>fitBorder(m,bclamp(v),b.height)));rowTo(wh,'Height (1-16)',inp('num',b.height,v=>fitBorder(m,b.width,bclamp(v))));
  const lb=document.createElement('div');lb.className='row';lb.innerHTML=[1,2,3,4,5].map(i=>`<button data-l="${i}" class="${i===layer?'on':''}">L${i}</button>`).join('');lb.onclick=ev=>{if(ev.target.dataset.l)setLayer(+ev.target.dataset.l)};U.appendChild(lb);
  const tb=document.createElement('div');tb.className='row';tb.innerHTML=[['pencil','Pencil'],['fill','Fill'],['erase','Erase']].map(([t,l])=>`<button data-bt="${t}" class="${t===btool?'on':''}">${l}</button>`).join('');
  tb.onclick=ev=>{if(ev.target.dataset.bt){btool=ev.target.dataset.bt;tb.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.bt===btool))}};U.appendChild(tb);
  const c=document.createElement('canvas');c.id='bcv';const cs=Math.max(16,Math.min(64,Math.floor(300/Math.max(b.width,b.height))));c.width=b.width*cs;c.height=b.height*cs;U.appendChild(c);
  const bp=ev=>{const r=c.getBoundingClientRect(),x=Math.floor((ev.clientX-r.left)/r.width*b.width),y=Math.floor((ev.clientY-r.top)/r.height*b.height);return x>=0&&y>=0&&x<b.width&&y<b.height?{gx:x,gy:y}:null};
  const act=p=>{if(btool==='pencil')bstamp(b,p.gx,p.gy,brush.cells);else if(btool==='erase')bset(b,layer,p.gy,p.gx,'');else bfill(b,p.gx,p.gy,brush.cells);drawBorderEd();redraw()};
  c.oncontextmenu=ev=>ev.preventDefault();
  c.onmousedown=ev=>{if(ev.button)return;const p=bp(ev);if(!p)return;bstroke={last:p};act(p)};
  c.onmousemove=ev=>{if(!bstroke||btool==='fill')return;const p=bp(ev);if(!p)return;line(bstroke.last,p,(x,y)=>act({gx:x,gy:y}));bstroke.last=p};
  const ab=document.createElement('div');ab.className='row';U.appendChild(ab);
  const mk=(t,f)=>{const x=document.createElement('button');x.textContent=t;x.onclick=f;ab.appendChild(x)};
  mk('Clear layer',()=>commit(()=>{b['tileData_'+layer]=b['tileData_'+layer].map(r=>r.map(()=>''))}));
  mk('Clear all layers',()=>commit(()=>{for(let l=1;l<=5;l++)b['tileData_'+l]=b['tileData_'+l].map(r=>r.map(()=>''))}));
  mk('Apply to ALL maps',()=>{if(confirm('Copy this border to every map?'))commit(()=>{for(const o of Object.values(repo))if(o!==m)o.borderData=clone(b)})});
  const src=document.createElement('select');src.add(new Option('Copy border from…',''));Object.keys(repo).filter(k=>k!==active).forEach(k=>src.add(new Option(k,k)));
  src.onchange=()=>{if(src.value){const f=src.value;commit(()=>{m.borderData=clone(repo[f].borderData)})}};U.appendChild(src);
  drawBorderEd();
  if(tab==='border'&&U.nextSibling!==$('palWrap'))U.after($('palWrap'))}

  music:repo[active]?.music||'',connections:{up:null,down:null,left:null,right:null},events:{},wildData:{morning:[],afternoon:[],night:[],dawn:[]},tileData:[]};fit(repo[n]);active=n});focus(n)};
